services:
  # Base de dades MySQL
  mysql:
    image: mysql:8.0
    container_name: parklive_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Europe/Madrid
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts d'inicialització de MySQL: es copien dins /docker-entrypoint-initdb.d i es crida un script que els agrupa
      - ./database:/docker-init:ro
      - ./database/init-db-container.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
    networks:
      - parklive_network

  # Servei PHP
  php-service:
    build:
      context: ./services/php-service
      dockerfile: Dockerfile
    container_name: parklive_php
    restart: always
    ports:
      - "${PHP_SERVICE_PORT}:80"
    volumes:
      - ./services/php-service:/var/www/html
      - ./shared:/var/www/shared
      - ./storage:/var/www/html/storage
    depends_on:
      - mysql
      - python-service
    environment:
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      PYTHON_SERVICE_URL: http://python-service:${FLASK_PORT}
      STRIPE_APIPrivada: ${STRIPE_APIPrivada}
      STRIPE_APIPublica: ${STRIPE_APIPublica}
      UPLOAD_DIR: ${UPLOAD_DIR}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: ${APP_ENV}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TZ: Europe/Madrid
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    networks:
      - parklive_network

  # Servei Python
  python-service:
    build:
      context: ./services/python-service
      dockerfile: Dockerfile
      # Helps when BuildKit cannot resolve DNS inside the build container.
      network: host
    container_name: parklive_python
    restart: always
    #Dns configurat perque sino causa problemes en la red del thos i codina
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    ports:
      - "${PYTHON_SERVICE_PORT}:${FLASK_PORT}"
    volumes:
      - ./services/python-service:/app
      - ./shared:/app/shared
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      smtp_mail: ${smtp_mail}
      smtp_pasword: ${smtp_pasword}
      RESET_CODE_TTL_MINUTES: 30
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FLASK_PORT: ${FLASK_PORT}
      FRONTEND_PORT: ${FRONTEND_PORT}
      FLASK_ENV: development
      PYTHONUNBUFFERED: 1
      STRIPE_APIPrivada: ${STRIPE_APIPrivada}
      STRIPE_APIPublica: ${STRIPE_APIPublica}
      STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID}
      STRIPE_Anual_PREMIUM_PRICE_ID: ${STRIPE_Anual_PREMIUM_PRICE_ID}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: ${APP_ENV}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TICKET_STORAGE_PATH: ${TICKET_STORAGE_PATH}
      TZ: Europe/Madrid
    networks:
      - parklive_network

  # Servei Cron (Automatització de actualitzacio de subscripcions a la BDD)
  cron-service:
    build:
      context: ./services/python-service
      dockerfile: Dockerfile
      network: host
    container_name: parklive_cron
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./services/python-service:/app
      - ./shared:/app/shared
      - ./storage:/app/storage
    environment:
      PYTHONPATH: /app
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      STRIPE_APIPrivada: ${STRIPE_APIPrivada}
      STRIPE_APIPublica: ${STRIPE_APIPublica}
      TICKET_STORAGE_PATH: ${TICKET_STORAGE_PATH}
      TZ: Europe/Madrid
    entrypoint: [ "/bin/sh", "/app/scripts/cron_scheduler.sh" ]
    networks:
      - parklive_network

  # Servei Frontend
  frontend-service:
    build:
      context: ./services/frontend-service
      dockerfile: Dockerfile
    container_name: parklive_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      PHP_SERVICE_PORT: ${PHP_SERVICE_PORT}
      PYTHON_SERVICE_PORT: ${PYTHON_SERVICE_PORT}
      STRIPE_PUBLIC_KEY: ${STRIPE_APIPublica}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      IVA_PERCENTAGE: ${IVA_PERCENTAGE}
      PREMIUM_DISCOUNT: ${PREMIUM_DISCOUNT}
      TZ: Europe/Madrid
    volumes:
      - ./services/frontend-service/src:/usr/share/nginx/html/src
      - ./services/frontend-service/public:/usr/share/nginx/html
    networks:
      - parklive_network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: parklive_phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 300M
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Europe/Madrid
    depends_on:
      - mysql
    networks:
      - parklive_network
    volumes:
      - ./config/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php

volumes:
  mysql_data:
    driver: local

networks:
  parklive_network:
    driver: bridge
