<!-- Document HTML per a profile-favorites.html: Estructura de la pàgina principal -->
<!-- Favorits Component -->
<section class="profile-section" id="section-favorites">
  <div class="card shadow-sm border-0 rounded-4 mb-3">
    <div class="card-body p-4">
      <div class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom">
        <span class="rounded-3 p-2 bg-danger bg-opacity-10 text-danger fs-5">
          <i class="bi bi-heart-fill"></i>
        </span>
        <div>
          <h2 class="card-title h6 fw-bold mb-0">Aparcaments favorits</h2>
          <p class="card-subtitle text-body-secondary small mb-0">
            Llistat dels aparcaments que has guardat
          </p>
        </div>
      </div>

      <div id="favorites-list" class="d-grid gap-2">
        <div class="text-center py-4 text-muted">
          <output
            class="spinner-border spinner-border-sm me-2"
            aria-label="Carregant"
          ></output>
          Carregant favorits...
        </div>
      </div>
    </div>
  </div>
</section>
