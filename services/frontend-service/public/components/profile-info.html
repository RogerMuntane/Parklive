<!-- Informació personal Component -->
<section class="profile-section active" id="section-info">
    <div class="card shadow-sm border-0 rounded-4 mb-3">
        <div class="card-body p-4">
            <div class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom">
                <span class="rounded-3 p-2 bg-danger bg-opacity-10 text-danger fs-5">
                    <i class="bi bi-person-vcard"></i>
                </span>
                <div>
                    <h2 class="card-title h6 fw-bold mb-0">Foto de perfil</h2>
                    <p class="card-subtitle text-muted small mb-0">Imatge visible al teu perfil públic</p>
                </div>
            </div>
            <div class="d-flex align-items-center gap-4">
                <div class="rounded-circle d-flex align-items-center justify-content-center bg-danger text-white fs-1"
                    style="width:72px;height:72px;flex-shrink:0;">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="d-flex flex-column gap-1">
                    <button class="btn btn-danger btn-sm w-auto">
                        <i class="bi bi-upload me-1"></i> Pujar imatge
                    </button>
                    <small class="text-muted">JPG, PNG o WebP · Màx. 2 MB</small>
                </div>
            </div>
        </div>
    </div>
    <div class="card shadow-sm border-0 rounded-4 mb-3">
        <div class="card-body p-4">
            <div class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom">
                <span class="rounded-3 p-2 bg-danger bg-opacity-10 text-danger fs-5">
                    <i class="bi bi-pencil"></i>
                </span>
                <div>
                    <h2 class="card-title h6 fw-bold mb-0">Dades personals</h2>
                    <p class="card-subtitle text-muted small mb-0">Actualitza la teva informació de compte</p>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-sm-6">
                    <label class="form-label text-uppercase small fw-semibold text-secondary"
                        style="letter-spacing:.04em;font-size:.75rem!important;" for="p-nom">Nom</label>
                    <input class="form-control" type="text" id="p-nom" value="Jordi" placeholder="Nom" />
                </div>
                <div class="col-sm-6">
                    <label class="form-label text-uppercase small fw-semibold text-secondary"
                        style="letter-spacing:.04em;font-size:.75rem!important;" for="p-cognoms">Cognoms</label>
                    <input class="form-control" type="text" id="p-cognoms" value="Puig Masó" placeholder="Cognoms" />
                </div>
                <div class="col-sm-6">
                    <label class="form-label text-uppercase small fw-semibold text-secondary"
                        style="letter-spacing:.04em;font-size:.75rem!important;" for="p-email">Correu electrònic</label>
                    <input class="form-control" type="email" id="p-email" value="jordi.puig@email.com"
                        placeholder="email@exemple.com" />
                </div>
                <div class="col-sm-6">
                    <label class="form-label text-uppercase small fw-semibold text-secondary"
                        style="letter-spacing:.04em;font-size:.75rem!important;" for="p-tel">Telèfon</label>
                    <input class="form-control" type="tel" id="p-tel" value="+34 612 345 678"
                        placeholder="+34 6XX XXX XXX" />
                </div>
                <div class="col-12">
                    <label class="form-label text-uppercase small fw-semibold text-secondary"
                        style="letter-spacing:.04em;font-size:.75rem!important;" for="p-bio">Biografia breu</label>
                    <textarea class="form-control" id="p-bio" rows="2"
                        placeholder="Explica breument qui ets…"></textarea>
                </div>
                <div class="col-12 d-flex gap-2 justify-content-end pt-1">
                    <button class="btn btn-outline-secondary">Cancel·lar</button>
                    <button class="btn btn-danger" onclick="showToast('Canvis desats correctament')">
                        <i class="bi bi-check2 me-1"></i> Desar canvis
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
