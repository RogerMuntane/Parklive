<!-- Canviar contrasenya Component -->
<section class="profile-section" id="section-password">
    <div class="card shadow-sm border-0 rounded-4 mb-3" style="max-width:520px">
        <div class="card-body p-4">
            <div class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom">
                <span class="rounded-3 p-2 bg-danger bg-opacity-10 text-danger fs-5">
                    <i class="bi bi-shield-lock"></i>
                </span>
                <div>
                    <h2 class="card-title h6 fw-bold mb-0">Canviar contrasenya</h2>
                    <p class="card-subtitle text-muted small mb-0">Usa almenys 8 caràcters amb lletres i números</p>
                </div>
            </div>
            <div class="d-flex flex-column gap-3">
                <div>
                    <label class="form-label text-uppercase small fw-semibold text-secondary"
                        style="letter-spacing:.04em;font-size:.75rem!important;" for="pass-actual">Contrasenya
                        actual</label>
                    <div class="input-group">
                        <input class="form-control" type="password" id="pass-actual" placeholder="••••••••" />
                        <button class="btn btn-outline-secondary" type="button" data-action="toggle-password">
                            <i class="bi bi-eye text-body-tertiary"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="form-label text-uppercase small fw-semibold text-secondary"
                        style="letter-spacing:.04em;font-size:.75rem!important;" for="pass-nova">Nova
                        contrasenya</label>
                    <div class="input-group">
                        <input class="form-control" type="password" id="pass-nova" placeholder="••••••••" />
                        <button class="btn btn-outline-secondary" type="button" data-action="toggle-password">
                            <i class="bi bi-eye text-body-tertiary"></i>
                        </button>
                    </div>
                    <div class="strength-bar mt-2">
                        <div class="strength-fill" id="strength-fill"></div>
                    </div>
                    <small id="strength-label" class="text-secondary">Introdueix una contrasenya</small>
                </div>
                <div>
                    <label class="form-label text-uppercase small fw-semibold text-secondary"
                        style="letter-spacing:.04em;font-size:.75rem!important;" for="pass-confirm">Confirma la nova
                        contrasenya</label>
                    <div class="input-group">
                        <input class="form-control" type="password" id="pass-confirm" placeholder="••••••••" />
                        <button class="btn btn-outline-secondary" type="button" data-action="toggle-password">
                            <i class="bi bi-eye text-body-tertiary"></i>
                        </button>
                    </div>
                </div>
                <div class="d-flex gap-2 justify-content-end pt-1">
                    <button class="btn btn-outline-secondary">Cancel·lar</button>
                    <button class="btn btn-danger" id="btn-update-password">
                        <i class="bi bi-lock me-1"></i> Actualitzar
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
