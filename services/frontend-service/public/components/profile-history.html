<!-- Historial Component -->
<section class="profile-section" id="section-history">
    <div class="card shadow-sm border-0 rounded-4 mb-3">
        <div class="card-body p-4">
            <div class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom">
                <span class="rounded-3 p-2 bg-danger bg-opacity-10 text-danger fs-5">
                    <i class="bi bi-receipt"></i>
                </span>
                <div>
                    <h2 class="card-title h6 fw-bold mb-0">Historial de pagaments</h2>
                    <p class="card-subtitle text-body-secondary small mb-0">Últims moviments del teu compte</p>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr class="text-uppercase text-body-secondary"
                            style="letter-spacing:.06em;font-size:.72rem!important;">
                            <th class="border-0 fw-semibold">Data</th>
                            <th class="border-0 fw-semibold">Descripció</th>
                            <th class="border-0 fw-semibold">Import</th>
                            <th class="border-0 fw-semibold">Estat</th>
                            <th class="border-0"></th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <!-- Les reserves es carregaran dinàmicament aquí -->
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">
                                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                Carregant historial...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-center mt-3">
                <button class="btn btn-outline-secondary btn-sm">Veure tot l'historial</button>
            </div>
        </div>
    </div>
</section>
