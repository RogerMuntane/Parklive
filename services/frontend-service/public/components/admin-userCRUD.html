<!-- Document HTML per a admin-userCRUD.html: Estructura de la pàgina principal -->
<!-- CRUD d'Usuaris (Només Admin) -->
<section id="section-admin-users" class="profile-section animate__animated animate__fadeIn">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-primary text-white p-4 border-0">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-danger bg-opacity-10 p-3 rounded-3 text-danger">
                        <i class="bi bi-people-fill fs-4"></i>
                    </div>
                    <div>
                        <h2 class="h5 fw-bold mb-0">Gestió d'Usuaris</h2>
                        <p class="small mb-0 opacity-75">Administra els comptes de la plataforma</p>
                    </div>
                </div>
                <button class="btn btn-light fw-bold px-4" id="btn-add-user" data-bs-toggle="modal"
                    data-bs-target="#modal-user">
                    <i class="bi bi-plus-lg me-2"></i> Afegir Usuari
                </button>
            </div>
        </div>

        <div class="card-body p-4">
            <!-- Barra de cerca i filtres -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="input-group search-group">
                        <span class="input-group-text bg-transparent border-end-0 text-secondary">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="user-search" class="form-control border-start-0 ps-0"
                            placeholder="Cerca per nom, cognoms o email...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select id="filter-role" class="form-select">
                        <option value="">Tots els rols</option>
                        <option value="basic">Bàsic</option>
                        <option value="premium">Premium</option>
                        <option value="operador">Operador</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

            </div>

            <!-- Taula d'usuaris -->
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light bg-opacity-50 text-secondary x-small text-uppercase fw-bold"
                        style="font-size: 0.75rem; letter-spacing: 0.05em;">
                        <tr>
                            <th class="ps-3">Usuari</th>
                            <th>Email</th>
                            <th>Telefon</th>
                            <th>Rol</th>
                            <th>Estat</th>
                            <th class="text-end pe-3">Accions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <!-- S'omplirà dinàmicament -->
                        <tr>
                            <td colspan="6" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Carregant...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Paginació -->
            <div class="d-flex justify-content-center mt-4">
                <nav aria-label="Paginació d'usuaris">
                    <ul class="pagination pagination-sm mb-0 shadow-sm" id="users-pagination">
                        <!-- S'omplirà dinàmicament -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</section>

<!-- Modal d'Usuari (Crear/Editar) -->
<div class="modal fade" id="modal-user" tabindex="-1" aria-labelledby="modal-user-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 p-4 pb-0">
                <h3 class="modal-title h5 fw-bold" id="modal-user-title">Afegir Usuari</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="form-user">
                <div class="modal-body p-4">
                    <input type="hidden" id="user-id" name="user-id">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Nom</label>
                            <input type="text" class="form-control" name="nom" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Cognoms</label>
                            <input type="text" class="form-control" name="cognoms" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="col-12" id="password-group">
                            <label class="form-label small fw-bold">Contrasenya</label>
                            <input type="password" class="form-control" name="contrasenya" required>
                            <div class="form-text x-small">Mínim 8 caràcters.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Telèfon</label>
                            <input type="tel" class="form-control" name="telefon">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Rol</label>
                            <select class="form-select" name="rol">
                                <option value="basic">Bàsic</option>
                                <option value="premium">Premium</option>
                                <option value="operador">Operador</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                        <div class="col-12" id="estat-group" style="display: none;">
                            <label class="form-label small fw-bold">Estat</label>
                            <select class="form-select" name="estat">
                                <option value="actiu">Actiu</option>
                                <option value="inactiu">Inactiu</option>
                                <option value="suspès">Suspès</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-outline-secondary px-4"
                        data-bs-dismiss="modal">Cancel·lar</button>
                    <button type="submit" class="btn btn-primary px-4 fw-bold" id="btn-save-user">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Confirmar Eliminació -->
<div class="modal fade" id="modal-delete-user" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-body p-4 text-center">
                <div class="text-danger mb-3">
                    <i class="bi bi-exclamation-triangle-fill fs-1"></i>
                </div>
                <h5 class="fw-bold mb-2">Eliminar Usuari</h5>
                <p class="text-secondary small mb-4">Estàs segur que vols eliminar aquest usuari? Aquesta acció no es pot desfer.</p>
                <input type="hidden" id="delete-user-id">
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-danger fw-bold py-2" id="btn-confirm-delete">Eliminar ara</button>
                    <button type="button" class="btn btn-link text-secondary text-decoration-none btn-sm" data-bs-dismiss="modal">Cancel·lar</button>
                </div>
            </div>
        </div>
    </div>
</div>
