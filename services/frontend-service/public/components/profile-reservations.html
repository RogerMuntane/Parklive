<!-- Reserves Actives Component -->
<section class="profile-section" id="section-reservations">
    <div class="card shadow-sm border-0 rounded-4 mb-3">
        <div class="card-body p-4">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="icon-box-reservations rounded-3 p-2 border bg-white shadow-sm d-flex align-items-center justify-content-center"
                    style="width: 48px; height: 48px;">
                    <i class="bi bi-calendar-event text-secondary fs-4"></i>
                </div>
                <div>
                    <h2 class="h5 fw-bold mb-0">Les teves reserves actives</h2>
                    <p class="text-secondary small mb-0">Consulta i gestiona les teves properes reserves</p>
                </div>
            </div>

            <div class="page-reserves-actives" id="profile-reservations-container">
                <!-- Les reserves es carregaran dinàmicament aquí -->
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Carregant...</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal de Cancel·lació -->
    <div class="modal fade" id="cancelModal" tabindex="-1" aria-labelledby="cancelModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 1.2rem;">
                <div class="modal-header border-bottom-0 pt-4 px-4">
                    <h5 class="modal-title fw-bold text-danger" id="cancelModalLabel">Cancel·lar Reserva</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tancar"></button>
                </div>
                <div class="modal-body py-4 px-4">
                    <div class="text-center mb-3">
                        <i class="bi bi-exclamation-circle text-danger" style="font-size: 3.5rem;"></i>
                    </div>
                    <p class="text-center fs-5 fw-bold mb-2">Estàs segur que vols cancel·lar aquesta reserva?</p>
                    <p class="text-secondary text-center small mb-0 px-3">Aquesta acció no es pot desfer. El
                        reemborsament s'aplicarà d'acord amb la nostra política de cancel·lació.</p>
                </div>
                <div class="modal-footer border-top-0 pb-4 px-4 justify-content-center gap-2">
                    <button type="button" class="btn btn-light px-4 py-2 border fw-semibold" 
                        data-bs-dismiss="modal" style="border-radius: 0.6rem;">No, mantenir</button>
                    <button type="button" class="btn btn-danger px-4 py-2 fw-semibold" id="confirmCancelBtn"
                        style="border-radius: 0.6rem;">Sí, cancel·lar</button>
                </div>
            </div>
        </div>
    </div>
</section>
