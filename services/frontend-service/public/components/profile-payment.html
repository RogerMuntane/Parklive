<!-- Mètode de pagament Component -->
<section class="profile-section" id="section-payment">
    <div class="card shadow-sm border-0 rounded-4 mb-3" style="max-width:560px">
        <div class="card-body p-4">
            <div class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom">
                <span class="rounded-3 p-2 bg-danger bg-opacity-10 text-danger fs-5">
                    <i class="bi bi-credit-card-2-front"></i>
                </span>
                <div>
                    <h2 class="card-title h6 fw-bold mb-0">Mètode de pagament</h2>
                    <p class="card-subtitle text-muted small mb-0">Targeta guardada per a pagaments ràpids</p>
                </div>
            </div>
            <div id="payment-methods-container">
                <!-- Les targetes es carregaran aquí dinàmicament -->
                <div class="text-center p-4">
                    <div class="spinner-border text-danger spinner-border-sm" role="status">
                        <span class="visually-hidden">Carregant...</span>
                    </div>
                    <p class="small text-muted mt-2">Carregant mètodes de pagament...</p>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top">
                <button class="btn btn-outline-danger w-100" id="btn-add-card">
                    <i class="bi bi-plus-circle me-1"></i> Afegir nova targeta
                </button>
            </div>

            <!-- Modal per afegir targeta -->
            <div class="modal fade" id="addCardModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content rounded-4 border-0 shadow">
                        <div class="modal-header border-0 pb-0">
                            <h5 class="modal-title fw-bold">Nova targeta</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body p-4">
                            <form id="payment-form">
                                <div id="link-authentication-element">
                                    <!-- Stripe.js injects the Link Authentication Element -->
                                </div>
                                <div id="payment-element" class="mb-3">
                                    <!-- Stripe.js injects the Payment Element -->
                                </div>
                                <button id="submit" class="btn btn-danger w-100 py-2 fw-bold">
                                    <span id="button-text">Desar targeta</span>
                                    <div class="spinner-border spinner-border-sm d-none" id="spinner" role="status"></div>
                                </button>
                                <div id="payment-message" class="alert alert-danger d-none mt-3 small"></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
