<!DOCTYPE html>
<html lang="ca" data-bs-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Perfil d'usuari ParkLive." />
    <title>ParkLive | Perfil d'usuari</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <script src="https://js.stripe.com/v3/"></script>
</head>

<body class="page page-profile">

    <div class="d-flex min-vh-100">

        <!-- ══ SIDEBAR (component) ══════════════════════════════ -->
        <aside class="template-slot" data-template="components/sidebar.html"></aside>

        <!-- ══ MAIN ═════════════════════════════════════════════ -->
        <main class="flex-grow-1 p-4" id="main-content">

            <!-- Top bar -->
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
                <div>
                    <p class="text-uppercase text-secondary small mb-1"
                        style="letter-spacing:.08em;font-size:.72rem!important;">
                        ParkLive · Compte
                    </p>
                    <h1 class="h4 fw-bold mb-0" id="section-title">Informació personal</h1>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary btn-sm" type="button"
                        aria-label="Activar tema fosc" data-theme-toggle="dark">
                        <i class="bi bi-moon"></i>
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" type="button"
                        aria-label="Activar tema clar" data-theme-toggle="light">
                        <i class="bi bi-sun"></i>
                    </button>
                    <a href="/index.html" class="btn btn-outline-secondary btn-sm" aria-label="Inici">
                        <i class="bi bi-house"></i>
                    </a>
                </div>
            </div>

            <!-- ── SECCIONS PERFIL (components) ──────────────────── -->
            <div class="template-slot" data-template="components/profile-info.html"></div>
            <div class="template-slot" data-template="components/profile-password.html"></div>
            <div class="template-slot" data-template="components/profile-history.html"></div>
            <div class="template-slot" data-template="components/profile-payment.html"></div>
            <div class="template-slot" data-template="components/profile-plan.html"></div>
            <div class="template-slot" data-template="components/profile-manage.html"></div>
            <div class="template-slot" data-template="components/profile-notifications.html"></div>
        </main>

        <script src="assets/vendor/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="src/js/main.js"></script>
    </div>
</body>

</html>
