<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ParkLive - Plataforma web para gestión inteligente de parking.">
    <title>ParkLive | Gestión de Parking</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body class="page page-landing">
    <!-- Slot de plantilla: Header reutilizable -->
    <div class="template-slot" data-template="./components/header.html" aria-label="Header"></div>

    <main class="main-content d-flex" id="main-content">
        <div id="filtresSidepanel" class="bg-secondary filtresSidepanel">
            <h1 class="p-4" onclick="Filtres(this)">☰</h1>
        </div>
        <div id="map" class="flex-grow-1" style="height:800px;"></div>

    </main>

    <!-- Slot de plantilla: Footer reutilizable -->
    <div class="template-slot" data-template="components/footer.html" aria-label="Footer"></div>

    <script src="assets/vendor/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="src/js/main.js"></script>
    <script>
var map = L.map('map').setView([41.3851, 2.1734], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

L.marker([41.3851, 2.1734]).addTo(map)
  .bindPopup("Barcelona")
  .openPopup();
</script>
<script>
    function Filtres(element) {
        const sidepanel = document.getElementById("filtresSidepanel");
        sidepanel.classList.toggle("filtresVisible");
        setTimeout(() =>map.invalidateSize(), 310)
    }
</script>
</body>

</html>
