<!DOCTYPE html>
<html lang="ca">
<head>
  <link rel="icon" type="image/png" href="./assets/images/parklive_logo_grande.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Article del Blog de ParkLive" />
  <title>ParkLive | Blog</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>

<body class="page page-blog-detall bg-body-tertiary">
  <!-- Header -->
  <div class="template-slot" data-template="components/header.html" aria-label="Header"></div>

  <!-- Main Content -->
  <main class="main-content py-5">
    <div class="container">
      
      <!-- Back button -->
      <a href="/blog" class="btn btn-outline-secondary mb-4">
        <i class="bi bi-arrow-left me-2"></i> Tornar al Blog
      </a>

      <div id="blog-detall-loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregant article...</span>
        </div>
      </div>

      <div id="blog-detall-error" class="alert alert-danger d-none text-center" role="alert"></div>

      <article id="blog-detall-container" class="d-none bg-body rounded-4 shadow-sm p-4 p-md-5 mx-auto" style="max-width: 800px;">
        <!-- Header: Categoria, Data i Títol -->
        <div class="mb-4 text-center">
          <span id="article-categoria" class="badge bg-primary rounded-pill px-3 py-2 mb-3 text-uppercase"></span>
          <h1 id="article-titol" class="fw-bold mb-3"></h1>
          <p class="text-muted mb-0">
            <i class="bi bi-calendar3 me-2"></i><span id="article-data"></span> &nbsp;&bull;&nbsp;
            <i class="bi bi-person me-2"></i><span id="article-autor"></span> &nbsp;&bull;&nbsp;
            <i class="bi bi-eye me-2"></i><span id="article-visites"></span> visites
          </p>
        </div>

        <!-- Imatge Destacada -->
        <img id="article-imatge" src="" alt="Imatge article" class="img-fluid rounded-4 mb-5 w-100 object-fit-cover d-none" style="max-height: 400px;">

        <!-- Contingut -->
        <div id="article-contingut" class="fs-5 lh-lg">
          <!-- Text de l'article renderitzat via JS -->
        </div>
      </article>

    </div>
  </main>

  <!-- Footer -->
  <div class="template-slot" data-template="components/footer.html" aria-label="Footer"></div>

  <!-- Scripts -->
  <script src="assets/vendor/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
