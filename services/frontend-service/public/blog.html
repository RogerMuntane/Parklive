<!DOCTYPE html>
<html lang="ca">
<head>
  <link rel="icon" type="image/png" href="./assets/images/parklive_logo_grande.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Blog de ParkLive - Novetats i Consells" />
  <title>ParkLive | Blog</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>

<body class="page page-blog bg-body-tertiary">
  <!-- Header -->
  <div class="template-slot" data-template="components/header.html" aria-label="Header"></div>

  <!-- Main Content -->
  <main class="main-content py-5">
    <div class="container">
      <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">El Blog de ParkLive</h1>
        <p class="lead text-muted">Llegeix les últimes novetats, consells i articles sobre mobilitat.</p>
      </div>

      <div id="blog-loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregant articles...</span>
        </div>
      </div>

      <div id="blog-error" class="alert alert-danger d-none text-center" role="alert"></div>

      <div id="blog-container" class="row g-4 d-none">
        <!-- Articles rendered via JS -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div class="template-slot" data-template="components/footer.html" aria-label="Footer"></div>

  <!-- Scripts -->
  <script src="assets/vendor/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
