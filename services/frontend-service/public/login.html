<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acceso a ParkLive para gestionar el parking.">
    <title>ParkLive | Iniciar sesión</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="page page-auth page-login">
    <!-- Slot de plantilla: Header reutilizable -->
    <div class="template-slot" data-template="components/header.html" aria-label="Header"></div>

    <main class="main-content d-flex align-items-center justify-content-center min-vh-100" id="main-content">

        <!-- Card de login -->
        <div class="card shadow-lg border-0 rounded-4 mx-3 imatge-sortida">
            <div class="card-body p-4 p-sm-5">

                <!-- Alertas (dins la card, ocultes per defecte) -->
                <div class="alert alert-danger alert-error d-none shadow-sm mb-3" role="alert" aria-live="polite"></div>
                <div class="alert alert-success d-none shadow-sm mb-3" role="status" aria-live="polite"></div>

                <!-- Icono superior -->
                <div class="text-center mb-3">
                    <span
                        class="d-inline-flex align-items-center justify-content-center bg-body-secondary rounded-3 p-3">
                        <i class="bi bi-box-arrow-in-right fs-2 text-body-tertiary"></i>
                    </span>
                </div>

                <!-- Títol i subtítol -->
                <h1 id="login-title" class="fs-4 fw-bold text-center mb-1">Inicia sessió amb email</h1>
                <p class="text-muted text-center small mb-4">Accedeix al teu panell de gestió ParkLive.</p>

                <!-- Formulari -->
                <form class="form form-auth" action="/api/auth/login" method="post" novalidate>
                    <!-- Email -->
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-body border-end-0">
                            <i class="bi bi-envelope text-body-tertiary"></i>
                        </span>
                        <input type="email" class="form-control border-start-0 ps-0" id="email" name="email"
                            placeholder="Email" autocomplete="email" required>
                    </div>

                    <!-- Password -->
                    <div class="input-group mb-2">
                        <span class="input-group-text bg-body border-end-0">
                            <i class="bi bi-lock text-body-tertiary"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password"
                            name="password" placeholder="Contrasenya" autocomplete="current-password" required>
                        <button class="input-group-text bg-body border-start-0" type="button"
                            data-action="toggle-password" aria-label="Mostrar contrasenya">
                            <i class="bi bi-eye-slash text-body-tertiary"></i>
                        </button>
                    </div>

                    <!-- Forgot password -->
                    <div class="text-end mb-4">
                        <a class="text-decoration-none small text-muted" href="reset-password.html">Has oblidat la
                            contrasenya?</a>
                    </div>

                    <!-- Submit -->
                    <button class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold mb-3" type="submit">
                        Entrar
                    </button>
                </form>

                <!-- Separador -->
                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1">
                    <span class="mx-3 text-muted small">O inicia sessió amb</span>
                    <hr class="flex-grow-1">
                </div>

                <!-- Botons socials -->
                <div class="d-flex justify-content-center gap-3 mb-3">
                    <button class="btn btn-outline-secondary btn-lg rounded-pill px-4" type="button"
                        data-action="google-login" aria-label="Iniciar sessió amb Google">
                        <i class="bi bi-google"></i>
                    </button>
                    <button class="btn btn-outline-secondary btn-lg rounded-pill px-4" type="button"
                        aria-label="Iniciar sessió amb Apple">
                        <i class="bi bi-apple"></i>
                    </button>
                </div>

                <!-- Link a registre -->
                <p class="text-center text-muted small mb-0 mt-3">
                    No tens compte? <a class="fw-semibold text-decoration-none" href="register.html">Crea'n un</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Slot de plantilla: Footer reutilizable -->
    <div class="template-slot" data-template="components/footer.html" aria-label="Footer"></div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="assets/vendor/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="src/js/main.js"></script>
</body>

</html>
