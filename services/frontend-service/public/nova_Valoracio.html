<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deixa la teva valoració - ParkLive" />
    <title>ParkLive | Nova Valoració</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>

  <body class="page page-nova-valoracio">
    <!-- Slot de plantilla: Header reutilizable -->
    <div
      class="template-slot"
      data-template="./components/header.html"
      aria-label="Header"
    ></div>

    <main class="main-content py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <nav aria-label="breadcrumb" class="mb-4">
              <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index.html">Inici</a></li>
                <li class="breadcrumb-item">
                  <a href="/dashboard.html">Aparcaments</a>
                </li>
                <li class="breadcrumb-item">
                  <a href="/detall_Aparcament.html">Parking Central</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                  Nova Valoració
                </li>
              </ol>
            </nav>

            <div class="card card-custom p-4 p-md-5 shadow-lg border-0">
              <div class="text-center mb-5">
                <h1 class="display-5 fw-bold mb-2">
                  Com ha estat la teva experiència?
                </h1>
                <p class="text-muted">
                  La teva opinió ajuda a altres usuaris a trobar el millor lloc
                  per aparcar.
                </p>
              </div>

              <form id="form-valoracio">
                <!-- Selecció de l'aparcament (Info) -->
                <div
                  class="d-flex align-items-center gap-3 mb-5 p-3 bg-light rounded-3 border"
                >
                  <img
                    id="parking-image"
                    src="https://images.unsplash.com/photo-1506521781263-d8422e82f27a?auto=format&fit=crop&q=80&w=100&h=100"
                    class="rounded-2 shadow-sm object-fit-cover"
                    style="width: 100px; height: 100px"
                    alt="Parking Central"
                  />
                  <div>
                    <h5 class="mb-1 fw-bold" id="parking-name">Carregant...</h5>
                    <p class="mb-0 text-muted small">
                      <i class="bi bi-geo-alt-fill me-1"></i>
                      <span id="parking-address">...</span>
                    </p>
                  </div>
                </div>

                <!-- Puntuació amb estrelles -->
                <div class="mb-5 text-center">
                  <label class="form-label d-block fs-4 mb-3"
                    >Puntuació general</label
                  >
                  <div class="rating-stars h2">
                    <input
                      type="radio"
                      name="puntuacio"
                      value="1"
                      id="star1"
                      class="btn-check"
                    /><label for="star1" class="bi bi-star"></label>
                    <input
                      type="radio"
                      name="puntuacio"
                      value="2"
                      id="star2"
                      class="btn-check"
                    /><label for="star2" class="bi bi-star"></label>
                    <input
                      type="radio"
                      name="puntuacio"
                      value="3"
                      id="star3"
                      class="btn-check"
                    /><label for="star3" class="bi bi-star"></label>
                    <input
                      type="radio"
                      name="puntuacio"
                      value="4"
                      id="star4"
                      class="btn-check"
                    /><label for="star4" class="bi bi-star"></label>
                    <input
                      type="radio"
                      name="puntuacio"
                      value="5"
                      id="star5"
                      class="btn-check"
                    /><label for="star5" class="bi bi-star"></label>
                  </div>
                </div>

                <!-- Aspectes valorats -->
                <div class="mb-5">
                  <label class="form-label d-block fs-5 mb-3"
                    >Què t'ha agradat més?</label
                  >
                  <div class="row g-3">
                    <div class="col-6 col-md-3 text-center">
                      <input
                        type="checkbox"
                        class="btn-check aspect-checkbox"
                        id="asp-neteja"
                        value="neteja"
                        autocomplete="off"
                      />
                      <label
                        class="btn btn-outline-secondary w-100 py-3"
                        for="asp-neteja"
                      >
                        <i class="bi bi-trash d-block fs-3 mb-2"></i>Neteja
                      </label>
                    </div>
                    <div class="col-6 col-md-3 text-center">
                      <input
                        type="checkbox"
                        class="btn-check aspect-checkbox"
                        id="asp-seguretat"
                        value="seguretat"
                        autocomplete="off"
                      />
                      <label
                        class="btn btn-outline-secondary w-100 py-3"
                        for="asp-seguretat"
                      >
                        <i class="bi bi-shield-check d-block fs-3 mb-2"></i>
                        Seguretat
                      </label>
                    </div>
                    <div class="col-6 col-md-3 text-center">
                      <input
                        type="checkbox"
                        class="btn-check aspect-checkbox"
                        id="asp-preu"
                        value="preu"
                        autocomplete="off"
                      />
                      <label
                        class="btn btn-outline-secondary w-100 py-3"
                        for="asp-preu"
                      >
                        <i class="bi bi-currency-euro d-block fs-3 mb-2"></i>
                        Preu
                      </label>
                    </div>
                    <div class="col-6 col-md-3 text-center">
                      <input
                        type="checkbox"
                        class="btn-check aspect-checkbox"
                        id="asp-ubicacio"
                        value="ubicacio"
                        autocomplete="off"
                      />
                      <label
                        class="btn btn-outline-secondary w-100 py-3"
                        for="asp-ubicacio"
                      >
                        <i class="bi bi-geo-fill d-block fs-3 mb-2"></i>
                        Ubicació
                      </label>
                    </div>
                  </div>
                </div>

                <!-- Comentari -->
                <div class="mb-5">
                  <label for="comentari" class="form-label fs-5 mb-3"
                    >Explica'ns més detalls (opcional)</label
                  >
                  <textarea
                    class="form-control"
                    id="comentari"
                    rows="5"
                    placeholder="Escriu aquí el teu comentari..."
                  ></textarea>
                </div>

                <!-- Fotografies -->
                <div class="mb-5">
                  <label class="form-label fs-5 mb-3"
                    >Vols afegir alguna foto?</label
                  >
                  <div
                    class="upload-area border border-2 border-dashed rounded-3 p-5 text-center cursor-pointer"
                    id="foto-upload-area"
                    onclick="document.getElementById('foto-input').click()"
                  >
                    <i class="bi bi-cloud-arrow-up display-4 text-primary"></i>
                    <p class="mt-2 mb-0">
                      Fes clic aquí per
                      <span class="text-primary fw-bold"
                        >seleccionar fitxers</span
                      >
                    </p>
                    <small class="text-muted">Màxim 3 fotos (JPG, PNG)</small>
                  </div>
                  <input
                    type="file"
                    id="foto-input"
                    name="fotos_url[]"
                    accept="image/jpeg,image/png,image/webp"
                    multiple
                    style="display: none"
                  />
                  <div
                    id="foto-preview-container"
                    class="d-flex gap-2 mt-3 flex-wrap"
                  ></div>
                </div>

                <!-- Botons -->
                <div
                  class="d-flex gap-3 justify-content-end mt-5 pt-4 border-top"
                >
                  <button
                    type="button"
                    class="btn btn-light btn-lg px-5 border"
                    onclick="history.back()"
                  >
                    Cancel·lar
                  </button>
                  <button
                    type="submit"
                    id="btn-submit-review"
                    class="btn btn-parklive-action btn-lg px-5"
                  >
                    Publicar valoració
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Slot de plantilla: Footer reutilizable -->
    <div
      class="template-slot"
      data-template="components/footer.html"
      aria-label="Footer"
    ></div>

    <!-- Scripts -->
    <script src="assets/vendor/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="src/js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const stars = document.querySelectorAll(".rating-stars label");
        const inputs = document.querySelectorAll(".rating-stars input");

        function updateStarsState(hoverIndex) {
          let selectedIndex = -1;
          inputs.forEach((input, i) => {
            if (input.checked) {
              selectedIndex = i;
            }
          });

          const activeIndex = hoverIndex !== -1 ? hoverIndex : selectedIndex;

          stars.forEach((star, index) => {
            if (index <= activeIndex) {
              star.classList.remove("bi-star");
              star.classList.add("bi-star-fill", "text-warning");
            } else {
              star.classList.add("bi-star");
              star.classList.remove("bi-star-fill", "text-warning");
            }
          });
        }

        stars.forEach((star, index) => {
          star.addEventListener("mouseenter", () => updateStarsState(index));
          star.addEventListener("mouseleave", () => updateStarsState(-1));
          star.addEventListener("click", () => {
            // Let the input handle the click, then update state based on checked radio
            setTimeout(() => updateStarsState(-1), 10);
          });
        });
      });
    </script>
  </body>
</html>
