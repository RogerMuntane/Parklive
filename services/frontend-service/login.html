<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acceso a ParkLive para gestionar el parking.">
    <title>ParkLive | Iniciar sesión</title>
    <link rel="stylesheet" href="src/sass/main.css">
</head>

<body class="page page-auth page-login">
    <!-- Slot de plantilla: Header reutilizable -->
    <div class="template-slot" data-template="components/header.html" aria-label="Header"></div>

    <main class="main-content auth-layout" id="main-content">
        <section class="auth-section section" aria-labelledby="login-title">
            <div class="container auth-container">
                <header class="auth-header">
                    <h1 id="login-title" class="auth-title">Iniciar sesión</h1>
                    <p class="auth-subtitle">Accede a tu panel de gestión ParkLive.</p>
                </header>

                <!-- Mensajes de feedback preparados para mostrar por backend o JS -->
                <div class="alert alert-error is-hidden" role="alert" aria-live="polite">
                    Credenciales incorrectas. Revisa tu correo y contraseña.
                </div>
                <div class="alert alert-success is-hidden" role="status" aria-live="polite">
                    Inicio de sesión correcto. Redirigiendo al dashboard...
                </div>

                <!-- Formulario de login preparado para backend PHP -->
                <form class="form form-auth" action="/php-service/controllers/login.php" method="post" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="email">Correo electrónico</label>
                        <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña</label>
                        <input class="form-input" type="password" id="password" name="password"
                            autocomplete="current-password" required>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit">Entrar</button>
                        <a class="btn btn-secondary" href="register.html">Crear cuenta</a>
                    </div>
                </form>

                <p class="auth-links">
                    <a class="text-link" href="#">¿Has olvidado tu contraseña?</a>
                </p>
            </div>
        </section>
    </main>

    <!-- Slot de plantilla: Footer reutilizable -->
    <div class="template-slot" data-template="components/footer.html" aria-label="Footer"></div>

    <script src="src/js/main.js" defer></script>
</body>

</html>
